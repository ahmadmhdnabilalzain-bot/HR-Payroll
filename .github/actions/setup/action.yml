name: Set up Node and pnpm
description: >-
  Node 22 and pnpm pinned to the version the lockfile was written with,
  with the pnpm store cached, then a frozen-lockfile install.
runs:
  using: composite
  steps:
    # The root package.json has no packageManager field, so the pnpm
    # version is pinned here and in deploy/Dockerfile (PNPM_VERSION).
    - uses: pnpm/action-setup@v4
      with:
        version: 10.28.0
    - uses: actions/setup-node@v5
      with:
        node-version: 22
        cache: pnpm
    - shell: bash
      run: pnpm install --frozen-lockfile
