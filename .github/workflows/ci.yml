# Continuous integration. Actions are pinned to major versions, not
# commit SHAs: the SHAs could not be verified offline when this was
# written (see docs/ops/ops-kit-report.md). Pin them to SHAs before
# relying on this workflow for releases.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (line length)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm lines
      - run: pnpm lines:ops
      - run: pnpm lines:test
      - run: pnpm ops:test

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm typecheck
      - run: pnpm ops:typecheck

  # One job per package keeps each Vitest run's memory small. The
  # real-PostgreSQL suite skips itself here (no DATABASE_URL); it runs
  # in the postgres job below.
  unit:
    name: unit (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package: [contract, engine, wps, api, web]
    env:
      DATABASE_URL: ""
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm --filter "@payroll/${{ matrix.package }}" test

  # The real-PostgreSQL suite. DATABASE_URL is a superuser by design:
  # the harness (packages/api/tests/helpers/pg-env.ts) uses it only to
  # create plan3_owner and plan3_runtime and a schema per case, then
  # runs every query under test as plan3_runtime (no superuser, no
  # BYPASSRLS, owns nothing, granted payroll_app WITH SET TRUE). The
  # harness logs those roles in without a password, hence trust auth
  # on this throwaway service container.
  postgres:
    name: integration (PostgreSQL 16, non-superuser runtime)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: real-PostgreSQL suite
        run: >-
          pnpm --filter @payroll/api exec vitest run
          tests/pg.integration.test.ts
          --reporter=default --reporter=json
          --outputFile.json="$RUNNER_TEMP/pg.json"
      # The suite skips itself when DATABASE_URL is missing; a skipped
      # run must not pass.
      - run: node scripts/assert-tests-ran.mjs "$RUNNER_TEMP/pg.json"

  # Builds the image and runs the compose stack with fresh random
  # secrets: migrate job, serve-only API, smoke test, audit verify.
  docker:
    name: docker (build and compose smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: random secrets for a throwaway stack
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "PAYROLL_OWNER_PASSWORD=$(openssl rand -hex 24)"
            echo "PAYROLL_RUNTIME_PASSWORD=$(openssl rand -hex 24)"
            echo "PAYROLL_BACKUP_PASSWORD=$(openssl rand -hex 24)"
            echo "PAYROLL_MASTER_KEY=$(openssl rand -base64 32)"
            echo "API_PORT=8787"
          } > "$RUNNER_TEMP/ci.env"
          node deploy/check-env.mjs --target compose \
            --file "$RUNNER_TEMP/ci.env"
      - name: the example file is refused
        run: |
          if node deploy/check-env.mjs --target compose \
            --file deploy/.env.example; then
            echo "check-env accepted deploy/.env.example" >&2
            exit 1
          fi
      - name: build and start
        run: >-
          docker compose -f deploy/docker-compose.yml
          --env-file "$RUNNER_TEMP/ci.env" up -d --build
      - name: wait for a healthy API
        run: |
          for i in $(seq 1 60); do
            s=$(docker inspect -f '{{.State.Health.Status}}' \
              payroll-api-1 2>/dev/null || true)
            [ "$s" = healthy ] && exit 0
            sleep 2
          done
          echo "API not healthy (last: $s)" >&2
          exit 1
      - run: sh deploy/smoke-test.sh http://127.0.0.1:8787
      - name: audit chain verify tool
        run: >-
          docker compose -f deploy/docker-compose.yml
          --env-file "$RUNNER_TEMP/ci.env" run --rm verify
      - name: logs
        if: always()
        run: >-
          docker compose -f deploy/docker-compose.yml
          --env-file "$RUNNER_TEMP/ci.env" logs --no-color
      - name: tear down
        if: always()
        run: >-
          docker compose -f deploy/docker-compose.yml
          --env-file "$RUNNER_TEMP/ci.env" down -v
