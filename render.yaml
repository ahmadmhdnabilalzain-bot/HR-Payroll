# Render Blueprint for the HR payroll platform demo.
# Rules (LEDGER section 14): every resource is named hr-payroll-*; this
# file must never reuse the name of any other resource in the workspace
# (Render would apply this file to it); the owner's other project
# (manar-erp) is never touched. Created with existingResources
# create_new, never adopt.
projects:
  - name: hr-payroll
    environments:
      - name: demo
        services:
          # Demo site (free static site). Currently the plain placeholder.
          # NOTE: applying a Blueprint change triggers a deploy by itself
          # even with autoDeployTrigger off, so the real demo build
          # (apps/web) is only switched in AFTER the owner has approved
          # the previews in chat. The seeded demo API and its
          # private Postgres come later and need owner approval first.
          - type: web
            name: hr-payroll-demo-site
            runtime: static
            buildCommand: echo "static placeholder, nothing to build"
            staticPublishPath: ./deploy/render/demo-placeholder
            autoDeployTrigger: "off"
            envVars:
              - key: NODE_VERSION
                value: "22"
            routes:
              - type: rewrite
                source: /*
                destination: /index.html
            headers:
              - path: /*
                name: X-Robots-Tag
                value: noindex, nofollow
              - path: /*
                name: X-Content-Type-Options
                value: nosniff
              - path: /*
                name: Referrer-Policy
                value: no-referrer
