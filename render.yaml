# Render Blueprint for the HR payroll platform demo.
# Rules (LEDGER section 14): every resource is named hr-payroll-*; this
# file must never reuse the name of any other resource in the workspace
# (Render would apply this file to it); the owner's other project
# (manar-erp) is never touched. Created with existingResources
# create_new, never adopt.
projects:
  - name: hr-payroll
    environments:
      - name: demo
        services:
          # Demo site (free static site). Builds the browser-only demo
          # (apps/web, fictional data, no backend). Deploys are manual
          # during the demo sprint (autoDeployTrigger off) so a half
          # finished push never goes live. The seeded demo API and its
          # private Postgres come later and need owner approval first.
          - type: web
            name: hr-payroll-demo-site
            runtime: static
            buildCommand: >-
              corepack enable && corepack prepare pnpm@10.28.0 --activate
              && pnpm install --frozen-lockfile --filter "@payroll/web..."
              && pnpm --filter @payroll/web build
            staticPublishPath: ./apps/web/dist
            autoDeployTrigger: "off"
            envVars:
              - key: NODE_VERSION
                value: "22"
            routes:
              - type: rewrite
                source: /*
                destination: /index.html
            headers:
              - path: /*
                name: X-Robots-Tag
                value: noindex, nofollow
              - path: /*
                name: X-Content-Type-Options
                value: nosniff
              - path: /*
                name: Referrer-Policy
                value: no-referrer
